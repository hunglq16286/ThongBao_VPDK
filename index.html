<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tài liệu họp - nhập mật khẩu</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Times New Roman",Times,serif;color:#1f2937;background:#9b1c1c}
body.open{background:#e5e7eb}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;padding:26px 22px;border-radius:10px;width:min(92vw,360px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.box h1{font-size:18px;margin:0 0 6px;color:#9b1c1c}.box p{margin:0 0 16px;color:#555;font-size:14px}
.box input{width:100%;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:6px;text-align:center}
.box button{margin-top:12px;width:100%;padding:12px;font-size:16px;background:#9b1c1c;color:#fff;border:0;border-radius:6px;font-family:inherit;font-weight:bold}
#m{color:#b91c1c;font-size:14px;min-height:20px;margin-top:10px}
#app{display:none}
header{background:#9b1c1c;color:#fff;padding:10px 14px}
header h1{margin:0;font-size:16px;line-height:1.35}
nav{position:sticky;top:0;z-index:5;display:flex;background:#fff;border-bottom:1px solid #d6d6d6;overflow-x:auto}
.tb{flex:1 0 auto;border:0;background:none;padding:12px 14px;font:inherit;font-weight:bold;color:#555;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tb.on{color:#9b1c1c;border-bottom-color:#9b1c1c}
.tp{display:none}.tp.on{display:block}
.tool{position:sticky;top:46px;z-index:4;display:flex;gap:6px;align-items:center;justify-content:center;padding:6px;background:rgba(243,244,246,.95);border-bottom:1px solid #d6d6d6;font-size:14px}
.tool button,.tool a{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 11px;font:inherit;font-size:14px;color:#1f2937;text-decoration:none;cursor:pointer}
.tool span{min-width:54px;text-align:center}
.pages{padding:10px 0 30px;overflow-x:auto}
.pg{background:#fff;margin:0 auto 10px;box-shadow:0 1px 4px rgba(0,0,0,.2);position:relative}
.pg canvas{display:block;width:100%;height:100%}
.pg .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px}
.err{padding:30px;text-align:center;color:#b91c1c}
iframe.h{display:block;width:100%;height:calc(100vh - 92px);border:0;background:#fff}
</style></head><body>
<div id="lock"><form class="box" id="f"><h1>TÀI LIỆU NỘI BỘ</h1><p>Tài liệu họp<br>Vui lòng nhập mật khẩu để xem</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Mật khẩu" autofocus><button type="submit">Xem tài liệu</button><div id="m"></div></form></div>

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
function loadPdfJs(){return new Promise((ok,no)=>{if(window.pdfjsLib)return ok();const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
 s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok()};s.onerror=()=>no(new Error('net'));document.head.appendChild(s)})}
$('f').onsubmit=async e=>{e.preventDefault();const m=$('m');m.textContent='Đang mở...';let buf;
 try{const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode($('pw').value),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  buf=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
 }catch(x){m.textContent=window.crypto&&crypto.subtle?'Sai mật khẩu, vui lòng thử lại.':'Trình duyệt không hỗ trợ, hãy mở bằng Chrome/Safari qua https.';return}
 openBuf(buf,m)};
async function openBuf(buf,m){
 const ml=new DataView(buf.buffer).getUint32(0);const meta=JSON.parse(new TextDecoder().decode(buf.subarray(4,4+ml)));
 let off=4+ml;const files=meta.files.map(f=>{const b=buf.subarray(off,off+f.size);off+=f.size;return Object.assign({},f,{bytes:b})});
 if(files.length===1&&files[0].type==='html'){const h=new TextDecoder().decode(files[0].bytes);document.open();document.write(h);document.close();return}
 if(files.some(f=>f.type==='pdf')){try{await loadPdfJs()}catch(x){m.textContent='Không tải được trình xem PDF. Kiểm tra kết nối mạng rồi thử lại.';return}}
 $('lock').style.display='none';$('app').style.display='block';document.body.classList.add('open');document.title=meta.title;
 files.forEach((f,i)=>addTab(f,i));
 const h=parseInt(location.hash.slice(1));show(isNaN(h)?0:Math.min(Math.max(h-1,0),files.length-1));
};
const tabs=[];
function show(i){tabs.forEach((t,j)=>{t.btn.classList.toggle('on',i===j);t.pane.classList.toggle('on',i===j)});
 try{history.replaceState(null,'','#'+(i+1))}catch(e){};window.scrollTo(0,0);tabs[i].init&&tabs[i].init()}
function addTab(f,i){const btn=document.createElement('button');btn.className='tb';btn.textContent=f.name;btn.onclick=()=>show(i);$('nav').appendChild(btn);
 const pane=document.createElement('main');pane.className='tp';$('panes').appendChild(pane);const t={btn,pane};tabs.push(t);
 const mime=f.type==='pdf'?'application/pdf':'text/html';const url=URL.createObjectURL(new Blob([f.bytes],{type:mime}));
 if(f.type==='html'){t.init=()=>{if(t.done)return;t.done=1;const fr=document.createElement('iframe');fr.className='h';fr.src=url;pane.appendChild(fr)};return}
 t.init=()=>{if(t.done)return;t.done=1;pdfTab(pane,f,url)}}
async function pdfTab(pane,f,url){
 pane.innerHTML='<div class="tool"><button data-z="-">−</button><span>100%</span><button data-z="+">+</button><button data-z="fit">Vừa màn hình</button><a download></a></div><div class="pages"></div>';
 const a=pane.querySelector('a');a.href=url;a.download=f.file||(f.name+'.pdf');a.textContent='Tải PDF';
 const box=pane.querySelector('.pages'),lab=pane.querySelector('.tool span');let doc;
 try{doc=await pdfjsLib.getDocument({data:f.bytes.slice()}).promise}catch(e){box.innerHTML='<div class="err">Không đọc được file PDF này.</div>';return}
 const pages=[];for(let n=1;n<=doc.numPages;n++){const p=await doc.getPage(n);pages.push({p,vp:p.getViewport({scale:1})})}
 let zoom=1;const fitW=()=>Math.min(box.clientWidth-16,1000);
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)draw(e.target)}),{root:null,rootMargin:'600px 0px'});
 function layout(){box.innerHTML='';pages.forEach((o,k)=>{const w=fitW()*zoom,h=w*o.vp.height/o.vp.width;const d=document.createElement('div');d.className='pg';
  d.style.width=w+'px';d.style.height=h+'px';d.dataset.k=k;d.innerHTML='<div class="ld">Trang '+(k+1)+'/'+pages.length+'</div>';box.appendChild(d);io.observe(d)});lab.textContent=Math.round(zoom*100)+'%'}
 async function draw(d){if(d.dataset.r)return;d.dataset.r=1;const o=pages[+d.dataset.k];const w=parseFloat(d.style.width);
  const sc=w/o.vp.width*Math.min(window.devicePixelRatio||1,2.5);const vp=o.p.getViewport({scale:sc});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  try{await o.p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;d.innerHTML='';d.appendChild(c)}catch(e){d.dataset.r=''}}
 pane.querySelector('.tool').onclick=e=>{const z=e.target.dataset.z;if(!z)return;io.disconnect();
  zoom=z==='fit'?1:Math.min(4,Math.max(.5,zoom+(z==='+'?.25:-.25)));layout()};
 let rw=box.clientWidth;window.addEventListener('resize',()=>{if(pane.classList.contains('on')&&Math.abs(box.clientWidth-rw)>40){rw=box.clientWidth;io.disconnect();layout()}});
 layout()}
if(D.p){$('pw').style.display='none';document.querySelector('#f button').style.display='none';document.querySelector('#f h1').textContent='Đang mở tài liệu...';openBuf(u(D.p),$('m'))}
</script></body></html>
